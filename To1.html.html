<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nghiện game – vấn đề cấp bách cho hôm nay và mai sau ở thế hệ trẻ</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Pacifico&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--wall:19dvh;--pw:min(47vw,560px);--ph:min(calc(100dvh - 12dvh - 78px),780px);--lh:27dvh;--lr:3vw;--lt:1.5dvh;--lw:calc(var(--lh)*.625);--wl:5vw;--ww:min(22vw,250px);--wt:2.5dvh;--wh:14dvh;--paper:radial-gradient(ellipse at 30% 20%,#f6ebcb,#e6d3a3 85%);color-scheme:dark}
@media(max-width:760px){:root{--wall:18dvh;--pw:min(94vw,470px);--ph:min(calc(100dvh - 18dvh - 98px),700px);--lh:20dvh;--wl:4vw;--ww:36vw;--wt:2dvh;--wh:13dvh}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{overflow:hidden;background:#0d0a08;font-family:"Cormorant Garamond",Georgia,serif}
/* tường + cửa sổ */
.wall{position:fixed;z-index:0;top:0;left:0;right:0;height:var(--wall);background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 26px),linear-gradient(#1b2231,#10151f);box-shadow:0 6px 14px rgba(0,0,0,.7);border-bottom:6px solid #2b190c}
.win{position:absolute;left:var(--wl);top:var(--wt);width:var(--ww);height:var(--wh);border:6px solid #3a2414;border-radius:3px;box-shadow:0 0 0 2px #1a0e06,inset 0 0 14px #000,0 0 40px rgba(150,185,255,.25);overflow:hidden;background:linear-gradient(#071027,#1b3768 75%,#2d4f86)}
.win::before{content:"";position:absolute;inset:0;background:radial-gradient(1.3px 1.3px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 30% 60%,#fff,transparent),radial-gradient(1.2px 1.2px at 52% 14%,#fff,transparent),radial-gradient(1px 1px at 70% 48%,#fff,transparent),radial-gradient(1px 1px at 22% 82%,#fff,transparent),radial-gradient(1.2px 1.2px at 90% 78%,#fff,transparent);animation:tw 4s infinite alternate}
@keyframes tw{to{opacity:.55}}
.mn{position:absolute;right:16%;top:14%;width:26%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 36%,#fff,#eef2ff 55%,#c9d4f0);box-shadow:0 0 18px 6px rgba(200,220,255,.8),0 0 60px 20px rgba(150,185,255,.4)}
.cl{position:absolute;top:28%;left:-60%;width:60%;height:26%;border-radius:50%;background:rgba(120,150,210,.25);filter:blur(5px);animation:cd 40s linear infinite}
@keyframes cd{to{left:130%}}
.bars::before,.bars::after{content:"";position:absolute;background:#3a2414;box-shadow:0 0 3px #000}
.bars::before{left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px}.bars::after{top:50%;left:0;right:0;height:5px;margin-top:-2.5px}
.bars{position:absolute;inset:0}
.sill{position:absolute;left:calc(var(--wl) - 8px);top:calc(var(--wt) + var(--wh) + 8px);width:calc(var(--ww) + 16px);height:7px;background:linear-gradient(#5b3a20,#2e1a0c);border-radius:2px;box-shadow:0 4px 6px #000}
/* bàn */
.table{position:fixed;z-index:0;left:0;right:0;top:var(--wall);bottom:0;background:linear-gradient(rgba(0,0,0,.55),transparent 18%),repeating-linear-gradient(90deg,rgba(0,0,0,.4) 0 2px,transparent 2px 230px),repeating-linear-gradient(88deg,rgba(0,0,0,.08) 0 1px,transparent 1px 6px,rgba(255,255,255,.035) 6px 8px),linear-gradient(#4a2c18,#2a170a)}
.vig{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 40%,rgba(0,0,0,.75) 100%)}
#dim{position:fixed;inset:0;z-index:4;pointer-events:none;background:rgba(6,3,0,.6);opacity:0;transition:opacity .8s}
body.off #dim{opacity:1}
/* ánh trăng lọt qua cửa sổ */
#moon{position:fixed;z-index:5;pointer-events:none;left:calc(var(--wl) + 6px);top:calc(var(--wall) - 2dvh);width:var(--ww);height:78dvh;transform-origin:0 0;transform:skewX(27deg);background:linear-gradient(180deg,rgba(215,230,255,.5),rgba(160,190,250,.22) 50%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,#000 0 46%,transparent 46% 54%,#000 54%),linear-gradient(180deg,#000 0 46%,transparent 46% 54%,#000 54%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,#000 0 46%,transparent 46% 54%,#000 54%),linear-gradient(180deg,#000 0 46%,transparent 46% 54%,#000 54%);mask-composite:intersect;mix-blend-mode:screen;filter:blur(5px);opacity:.14;transition:opacity .6s}
/* đèn dầu */
#lamp{position:fixed;z-index:1;right:var(--lr);top:var(--lt);height:var(--lh);width:var(--lw);cursor:pointer}
#lamp svg{width:100%;height:100%;overflow:visible}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fk 1.6s infinite ease-in-out}
@keyframes fk{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.94,1.08) skewX(3deg)}50%{transform:scale(1.05,.94) skewX(-3deg)}75%{transform:scale(.97,1.05) skewX(1.5deg)}}
#glow{position:fixed;z-index:3;pointer-events:none;width:150vmax;height:150vmax;right:calc(var(--lr) + var(--lw)/2 - 75vmax);top:calc(var(--lt) + var(--lh)*.36 - 75vmax);background:radial-gradient(circle,rgba(255,196,100,.55) 0,rgba(255,150,50,.26) 9%,rgba(255,120,30,.08) 26%,transparent 46%);mix-blend-mode:screen;transition:opacity .15s}
body.off .flame{display:none}
/* sách */
.stage{position:fixed;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding:0 0 78px;perspective:2600px;perspective-origin:50% 30%;pointer-events:none}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);transform-style:preserve-3d;transition:transform 1.3s ease;pointer-events:auto}
.book.closed{transform:translateX(calc(var(--pw)/-2))}
.base{position:absolute;inset:-12px;border-radius:8px;background:linear-gradient(#5b2d17,#3c1b0d);box-shadow:0 30px 50px rgba(0,0,0,.75),inset 0 0 0 2px rgba(216,180,90,.35);transform:translateZ(-1px);transition:left 1.3s}
.book.closed .base{left:calc(var(--pw) - 12px)}
.pb{background:var(--paper);overflow:hidden}
.ls{background:linear-gradient(270deg,rgba(70,40,15,.55),transparent 12%),var(--paper)}
.rs{background:linear-gradient(90deg,rgba(70,40,15,.55),transparent 12%),var(--paper)}
.pagebox{position:absolute;top:0;width:var(--pw);height:100%}
#L{left:0;border-radius:4px 0 0 4px}#R{left:var(--pw);border-radius:0 4px 4px 0}
@media(max-width:760px){.book{width:var(--pw)}.book.closed{transform:none}.book.closed .base,.base{left:-12px}#L{display:none}#R{left:0;border-radius:4px}}
.leaf{position:absolute;top:0;width:var(--pw);height:100%;transform-style:preserve-3d;z-index:5;transform-origin:left center}
.leaf .f,.leaf .b{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.leaf .b{transform:rotateY(180deg)}
.leaf .f::after,.leaf .b::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(40,20,5,.5),transparent 75%);opacity:0;animation:sh 1.1s ease-in-out}
@keyframes sh{50%{opacity:1}}
#cover{left:var(--pw)}
@media(max-width:760px){#cover{left:0}}
.cv{background:linear-gradient(90deg,rgba(0,0,0,.5),transparent 8%),radial-gradient(ellipse at 30% 20%,#7a3a1e,#4a200f 70%,#2e1308);border-radius:3px 10px 10px 3px;padding:5%;color:#e3c26b;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.frame{height:100%;border:2px solid #d8b45a;outline:1px solid rgba(216,180,90,.6);outline-offset:-8px;border-radius:4px;padding:6% 7%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2%;text-shadow:0 1px 2px #000}
.frame small{letter-spacing:.3em;font-size:clamp(9px,1.5vh,12px)}
.frame h1{font:800 clamp(.95rem,2.9vh,1.45rem)/1.3 "Playfair Display",Georgia,serif;color:#f0d27c}
.cimg{flex:1;min-height:0;width:100%;border:1px solid #d8b45a;overflow:hidden;cursor:pointer;margin:3% 0}
.cimg svg,.cimg img{width:100%;height:100%;object-fit:cover;display:block}
.cnm{font-style:italic;font-size:clamp(12px,1.9vh,16px);opacity:.85}
.nm{font-weight:700;font-size:clamp(12px,1.9vh,16px);line-height:1.5}
/* trang: cỡ chữ tự co để vừa đủ, không bị cắt */
.in{position:relative;height:100%;padding:6% 7% 9%;overflow:hidden;color:#3a2a1c;font-size:24px;line-height:1.36}
.ch{text-align:center;letter-spacing:.28em;text-transform:uppercase;font-size:.72em;color:#9a7b4f;font-weight:700}
.in h2{font:800 1.6em/1.2 "Playfair Display",Georgia,serif;color:#6b2e14;text-align:center;margin:4px 0}
.sb{text-align:center;font-style:italic;color:#6b5236}
.orn{text-align:center;color:#9a6b2f;margin:6px 0 12px;letter-spacing:.3em}
.in p{position:relative;padding-left:1.3em;margin-bottom:.65em}
.in p::before{content:"❧";position:absolute;left:0;color:#9a6b2f}
.in b{color:#6b2e14}
.pn{position:absolute;left:0;right:0;bottom:3.5%;text-align:center;font-size:.8em;color:#8a6d42}
.mm{display:grid;grid-template-columns:1fr 1fr;column-gap:.8em;font:600 1.1em "Playfair Display",Georgia,serif;color:#4a2a14;margin-top:.5em}
.mm div{padding:.55em 0;border-bottom:1px dotted #b49a64;display:flex;align-items:center;gap:.5em}.mm div::before{content:"✦";color:#9a6b2f;font-size:.6em}
.in p.tx{padding-left:0;margin:0;text-align:justify}.in p.tx::before{content:none}
.toc{display:flex;align-items:baseline;gap:6px;margin-bottom:.55em}
.toc i{flex:1;border-bottom:2px dotted #a58a58}
.toc em{font-style:normal;color:#9a7b4f;min-width:2.4em}
table{width:100%;border-collapse:collapse;font-size:.95em}
th{color:#6b2e14;border-bottom:2px double #9a7b4f;text-align:left;padding:6px 4px}
td{padding:6px 4px;border-bottom:1px dotted #b49a64;vertical-align:top}
.thanks{text-align:center;font:800 1.5em "Playfair Display",Georgia,serif;color:#6b2e14;margin-top:.6em}
#openbtn{position:fixed;z-index:6;left:0;right:0;bottom:0;justify-content:center;align-items:center;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex}
#bar{display:none;position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);align-items:center;gap:4px;padding:5px;border-radius:999px;background:linear-gradient(#3b281a,#1f1209);border:1px solid rgba(216,180,90,.45);box-shadow:0 8px 22px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,235,190,.14)}
.nv{width:42px;height:42px;border-radius:50%;border:1px solid rgba(216,180,90,.4);background:radial-gradient(circle at 35% 28%,#654530,#2b1a0d);color:#f0d9a0;display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .12s,color .2s,opacity .2s;-webkit-tap-highlight-color:transparent;box-shadow:inset 0 1px 0 rgba(255,235,190,.2)}
.nv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nv:active{transform:scale(.9)}.nv:disabled{opacity:.3;pointer-events:none}
@media(hover:hover){.nv:hover{color:#fff3c8;border-color:#d8b45a}}
.btn{border:0;background:linear-gradient(#4a3220,#2b1a0d);color:#f0d9a0;padding:11px 22px;border-radius:12px;font:600 1rem "Playfair Display",Georgia,serif;letter-spacing:.03em;cursor:pointer;box-shadow:0 5px 0 #130a04,0 9px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,235,190,.22);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #130a04,0 3px 6px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,235,190,.15)}
#pi{color:#e8d49c;min-width:78px;text-align:center;font:600 .95rem "Playfair Display",Georgia,serif;letter-spacing:.04em}

/* ảnh minh họa đầu trang */
.pic{display:flex;gap:6px;height:25%;margin-bottom:.8em}
.pic img{flex:1;min-width:0;height:100%;object-fit:cover;border:1px solid #9a7b4f;border-radius:3px;box-shadow:0 2px 6px rgba(60,30,10,.35);filter:sepia(.18)}
/* ảnh ghép trên bìa */
.mos{width:100%;height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1.25fr 1fr;gap:2px;background:#d8b45a}
.mos img{min-width:0;min-height:0;filter:sepia(.3) contrast(1.05)}
.mos img:nth-child(1){grid-column:span 4}.mos img:nth-child(n+2){grid-column:span 2}
.mos img:nth-child(3){object-position:50% 75%}
/* trang cảm ơn: chữ bút lông */
.thx{container-type:inline-size;display:flex;flex-direction:column;justify-content:center;align-items:center;height:80%;gap:.3em}
.bl{position:relative;display:block;white-space:nowrap;font-family:Pacifico,"Dancing Script",cursive;line-height:1.3}
.bl.l1{font-size:17cqw;color:#4a1808}.bl.l2{font-size:7.4cqw;color:#6b2e14}.bl.l3{font-size:9cqw;color:#6b2e14}
.bt{display:block;padding:.08em .2em;clip-path:inset(-15% 100% -15% 0)}
.go .bt{animation:wr var(--d) cubic-bezier(.5,.1,.35,1) var(--s) forwards}
@keyframes wr{to{clip-path:inset(-15% 0 -15% 0)}}
.bb{position:absolute;left:0;bottom:6%;width:.55em;height:.85em;opacity:0;pointer-events:none;transform:translateX(-12%)}
.go .bb{animation:bm var(--d) cubic-bezier(.5,.1,.35,1) var(--s) forwards}
@keyframes bm{0%{left:0;opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
.endbtn{opacity:0;margin-top:1.2em}
.go .endbtn{animation:fi .8s ease var(--s) forwards}
@keyframes fi{to{opacity:1}}
</style></head><body>

<path d="M27 100Q3 97 8 124Q13 140 35 124" fill="none" stroke="#2a1806" stroke-width="5.4" stroke-linecap="round"/><path d="M27 100Q3 97 8 124Q13 140 35 124" fill="none" stroke="url(#bz)" stroke-width="4" stroke-linecap="round"/><path d="M26 99.5Q6 97.5 10 120" fill="none" stroke="#fff4cc" stroke-width="1" stroke-opacity=".85" stroke-linecap="round"/>

<small>NHÓM GOM · TIỂU LUẬN</small>
<h1><span style="font-size:1.35em">Nghiện game</span><br>vấn đề cấp bách cho hôm nay<br>và mai sau ở thế hệ trẻ</h1>
<label class="cimg" title="Bấm để đổi ảnh bìa"><input type="file" accept="image/*" id="file" hidden>

["Đặt vấn đề","Sự bùng nổ của công nghệ số biến game trở thành hình thức giải trí phổ biến nhất của giới trẻ. Tuy nhiên, ranh giới giữa giải trí lành mạnh và nghiện ngập mất kiểm soát ngày càng mong manh, tạo nên hai luồng ý kiến trái chiều trong xã hội: coi game là hiểm họa phá hủy tương lai hay là xu hướng giải trí, nghề nghiệp tất yếu của thời đại mới."],
["Thực trạng","Tổ chức Y tế Thế giới (WHO) đã chính thức xếp Rối loạn chơi game vào danh mục bệnh lý tâm thần. Có khoảng 70% – 80% thanh thiếu niên yêu thích game online, trong đó 10% – 15% có dấu hiệu nghiện. Nhiều học sinh dành từ 4 – 8 tiếng mỗi ngày, thậm chí thức thâu đêm để chơi game, làm đảo lộn hoàn toàn nhịp sinh hoạt và học tập."],
["Quan điểm phê phán (Tác hại)","Nghiện game gây ra những hệ lụy nghiêm trọng trên ba phương diện: làm suy kiệt thể chất (cận thị, thoái hóa cột sống, rối loạn giấc ngủ); gây tổn thương tâm lý (cáu gắt, trầm cảm, sống thu mình, tiêm nhiễm bạo lực ảo); và hủy hoại tương lai học tập, dễ dẫn đến các hành vi lệch chuẩn như trộm cắp tiền bạc để nạp game."],
["Quan điểm cởi mở (Giá trị tích cực)","Ở góc nhìn khách quan, game không hoàn toàn tiêu cực nếu biết kiểm soát. Đây là công cụ giải tỏa căng thẳng hiệu quả, giúp rèn luyện tư duy chiến thuật, phản xạ nhanh, kỹ năng làm việc nhóm và vốn ngoại ngữ. Bên cạnh đó, Thể thao điện tử (Esports) đang phát triển mạnh mẽ, mở ra nhiều cơ hội nghề nghiệp chính đáng như game thủ chuyên nghiệp, streamer hay lập trình viên."],
["Nguyên nhân","Tình trạng nghiện game bắt nguồn từ cả yếu tố chủ quan lẫn khách quan: tâm lý thích chinh phục nhưng thiếu kỹ năng quản lý thời gian của người trẻ; sự thiếu quan tâm, lắng nghe hoặc áp đặt quá mức từ gia đình khiến con cái tìm đến thế giới ảo để trốn tránh; cùng với việc thiếu sân chơi lành mạnh ngoài đời thực và sức hút gây nghiện được tính toán sẵn từ các nhà phát hành game."],
["Đánh giá & Giải pháp","Bản chất game là một sản phẩm công nghệ trung tính; tích cực hay tiêu cực phụ thuộc hoàn toàn vào cách con người sử dụng. Để giúp giới trẻ làm chủ thế giới ảo, cần sự kết hợp đồng bộ: mỗi cá nhân tự lập thời gian biểu khoa học và tích cực vận động; gia đình đồng hành, thấu hiểu thay vì cấm đoán cực đoan; nhà trường và xã hội tăng cường giáo dục kỹ năng số và tạo thêm nhiều sân chơi bổ ích."]
];
const H=(n,t,s)=>`<div class="ch">${n}</div><h2>${t}</h2>${s?`<div class="sb">${s}</div>`:""}<div class="orn">❦ ❦ ❦</div>`;
/* mục lục tự tổng hợp: trang 1 = thành viên, trang 2 = mục lục, các phần bắt đầu từ trang 3 */
const toc=[["✦","Thành viên nhóm",1],...S.map((s,i)=>[(i+1)+".",s[0],i+3]),["❦","Lời cảm ơn",S.length+3]];
const IM=[["i1"],["i5"],["i2","i3"],[],["i4"],[]];
const pic=a=>a.length?`<div class="pic">${a.map(k=>`<img src="${IMG[k]}" alt="">`).join("")}</div>`:"";
const P=[
H("Giới thiệu","Thành viên nhóm","Nhóm Gom")+`<div class="mm">${members.map(m=>`<div>${m}</div>`).join("")}</div>`,
H("Nghiện game","Mục lục","Các phần trong quyển sách")+toc.map(([a,t,n])=>`<div class="toc"><em>${a}</em><span>${t}</span><i></i><span>${n}</span></div>`).join(""),
...S.map(([t,c],i)=>pic(IM[i])+H("Phần "+(i+1),t,"")+`<p class="tx">${c}</p>`),
`<div class="orn">❦ ❦ ❦</div><div class="thx"><span class="bl l1" style="--s:.3s;--d:2.4s"><span class="bt">Thank you</span><svg class="bb" viewBox="0 0 40 64"><path d="M31 2L18 42" stroke="#5a3a1e" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M18 42L15.5 50" stroke="#c9973a" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M15.5 49C12 53 9 58 6 63C13 61 18 56 20 49Z" fill="#1a1208"/></svg></span><span class="bl l2" style="--s:2.9s;--d:2.2s"><span class="bt">Cảm ơn cô và các bạn</span><svg class="bb" viewBox="0 0 40 64"><path d="M31 2L18 42" stroke="#5a3a1e" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M18 42L15.5 50" stroke="#c9973a" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M15.5 49C12 53 9 58 6 63C13 61 18 56 20 49Z" fill="#1a1208"/></svg></span><span class="bl l3" style="--s:5.2s;--d:1.2s"><span class="bt">đã xem!</span><svg class="bb" viewBox="0 0 40 64"><path d="M31 2L18 42" stroke="#5a3a1e" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M18 42L15.5 50" stroke="#c9973a" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M15.5 49C12 53 9 58 6 63C13 61 18 56 20 49Z" fill="#1a1208"/></svg></span><button class="btn endbtn" style="--s:6.6s">Đóng sách ❦</button></div>`
];

const book=$("#book"),L=$("#L"),R=$("#R"),cv=$("#cover"),cvb=$("#cvb");
const mob=()=>matchMedia("(max-width:760px)").matches;
const CR='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',CL='<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>';
const N=P.length;let p=-1,busy=false,tok=0;
const pg=i=>i>=0&&i<N?`<div class="in">${P[i]}<div class="pn">— ${i+1} —</div></div>`:`<div class="in"></div>`;
/* tự chỉnh cỡ chữ to nhất có thể để nội dung đầy 1 trang */
function fit(el){if(!el||!el.clientHeight)return;const cap=el.querySelector(".mm,.toc,.thx")?30:44;let lo=11,hi=cap;const ok=s=>{el.style.fontSize=s+"px";return el.scrollHeight<=el.clientHeight+1};if(ok(hi))return;while(hi-lo>.4){const m=(lo+hi)/2;ok(m)?lo=m:hi=m}el.style.fontSize=lo+"px"}
/* hiệu ứng chữ hiện dần */
function prep(root){const items=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())if(!w.currentNode.parentElement.closest(".endbtn,.thx"))ns.push(w.currentNode);
 ns.forEach(n=>{const t=n.nodeValue;if(!t.trim())return;const v=document.createElement("span"),h=document.createElement("span");h.style.visibility="hidden";h.textContent=t;n.replaceWith(v,h);items.push({v,h,t,i:0})});return items}
function run(items){const my=++tok;let k=0,acc=0,last=performance.now();
 const step=now=>{if(my!==tok)return;acc+=(now-last)*95/1000;last=now;let n=Math.floor(acc);acc-=n;
  while(n>0&&k<items.length){const o=items[k],m=Math.min(n,o.t.length-o.i);o.i+=m;n-=m;o.v.textContent=o.t.slice(0,o.i);o.h.textContent=o.t.slice(o.i);if(o.i>=o.t.length)k++}
  if(k<items.length)requestAnimationFrame(step)};requestAnimationFrame(step)}
function render(el,i,hide){el.innerHTML=pg(i);const x=el.querySelector(".in");fit(x);return hide?prep(x):[]}
/* độ dày sách: chồng giấy bên trái tăng, bên phải giảm theo trang đã lật */
const edge=(n,sx)=>{const s=[];for(let k=1;k<=n;k++)s.push(`${sx*k}px ${(k*.8).toFixed(1)}px 0 ${k%2?"#e4d4a6":"#b9a674"}`);s.push(`${sx*(n+1)}px ${n*.8+8}px 14px rgba(0,0,0,.65)`);return s.join(",")};
function th(f){L.style.boxShadow=edge(Math.round(1+11*f),-1);R.style.boxShadow=edge(Math.round(1+11*(1-f)),1)}
const prog=q=>mob()?q/(N-1):(q&~1)/(N-2);
function paint(typeIt=true){let it=[];
 if(p<0){L.style.visibility="hidden";L.innerHTML="";it=render(R,mob()?0:1,true);th(0)}
 else if(mob()){L.innerHTML="";it=render(R,p,typeIt);th(prog(p))}
 else{const s=p&~1;L.style.visibility="";it=[...render(L,s,typeIt),...render(R,s+1,typeIt)];th(prog(p))}
 $("#bar").style.display=p<0?"none":"flex";$("#openbtn").style.display=p<0&&!busy?"flex":"none";
 if(p>=0){$("#pi").textContent=mob()?`${p+1} / ${N}`:`${(p&~1)+1}–${(p&~1)+2} / ${N}`;const last=mob()?p>=N-1:(p&~1)>=N-2;$("#nx").innerHTML=last?CL:CR;$("#nx").setAttribute("aria-label",last?"Đóng sách":"Trang sau")}
 document.querySelectorAll(".thx").forEach(e=>e.classList.add("go"));
 typeIt?run(it):tok++}
function cvBack(hide){cvb.innerHTML=mob()?"":pg(0);const x=cvb.querySelector(".in");if(x){fit(x);if(hide)prep(x)}}
function mk(f,b,fc,bc,left,hf,hb,tz=0){const d=document.createElement("div");d.className="leaf";d.style.left=left;
 d.innerHTML=`<div class="f pb ${fc}">${pg(f)}</div><div class="b pb ${bc}">${pg(b)}</div>`;book.appendChild(d);
 d.querySelectorAll(".in").forEach(fit);if(hf)prep(d.querySelector(".f .in"));if(hb)prep(d.querySelector(".b .in"));d._tz=tz;return d}
function spin(el,a,z,o,delay,tz){el.style.transformOrigin=o;return el.animate([{transform:`translateZ(${tz}px) rotateY(${a}deg)`},{transform:`translateZ(${tz}px) rotateY(${z}deg)`}],{duration:1100,delay,easing:"cubic-bezier(.45,.05,.3,1)",fill:"both"}).finished}
/* lật cả một xấp giấy mỏng (tạo độ dày), tờ trên cùng mang nội dung */
function turn(f,b,fc,bc,left,hf,hb,a,z,o){const top=mk(f,b,fc,bc,left,hf,hb),ex=[1,2,3].map(k=>mk(-1,-1,fc,bc,left,0,0));
 return Promise.all([spin(top,a,z,o,0,3),...ex.map((e,i)=>spin(e,a,z,o,60*(i+1),2-i))]).then(()=>[top,...ex].forEach(e=>e.remove()))}
function openBook(){busy=true;tok++;book.classList.remove("closed");$("#openbtn").style.display="none";L.style.visibility="hidden";
 spin(cv,0,-180,"left center",0,0).then(()=>{cv.style.display="none";p=0;busy=false;paint()})}
function closeBook(){busy=true;tok++;cvBack(false);cv.style.display="";render(R,mob()?0:1,true);book.classList.add("closed");th(0);
 spin(cv,-180,0,"left center",0,0).then(()=>{p=-1;busy=false;cvBack(true);paint()})}
function endBook(){if(busy)return;busy=true;tok++;
 const fo=book.animate([{opacity:1},{opacity:0}],{duration:450,fill:"forwards"});
 fo.finished.then(()=>{busy=false;closeBook();fo.cancel();book.animate([{opacity:0},{opacity:1}],{duration:700})})}
function next(){if(busy)return;if(p<0){openBook();return}
 if(mob()?p>=N-1:(p&~1)>=N-2){endBook();return}busy=true;tok++;
 if(mob()){render(R,p+1,true);th(prog(p+1));turn(p,-1,"rs","ls","0",0,0,0,-180,"left center").then(()=>{p++;busy=false;paint()})}
 else{const s=p&~1;render(R,s+3,true);th((s+2)/(N-2));turn(s+1,s+2,"rs","ls","var(--pw)",0,1,0,-180,"left center").then(()=>{p=s+2;busy=false;paint()})}}
function prev(){if(busy||p<0)return;if(mob()?p===0:(p&~1)===0){closeBook();return}busy=true;tok++;
 if(mob()){th(prog(p-1));turn(p-1,-1,"rs","ls","0",1,0,-180,0,"left center").then(()=>{p--;busy=false;paint()})}
 else{const s=p&~1;render(L,s-2,true);th((s-2)/(N-2));turn(s,s-1,"ls","rs","0",0,1,0,180,"right center").then(()=>{p=s-2;busy=false;paint()})}}
addEventListener("click",e=>{if(e.target.closest(".endbtn"))endBook()});
$("#openbtn").onclick=next;$("#nx").onclick=next;$("#pv").onclick=prev;
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key))next();if(["ArrowLeft","PageUp"].includes(e.key))prev()});
let x0=null;addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70)(d<0?next:prev)();x0=null});
addEventListener("resize",()=>{if(!busy){if(p>=0&&!mob())p&=~1;paint(false);cvBack(false)}});
$("#lamp").onclick=()=>document.body.classList.toggle("off");
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.src=r.result;$("#art").replaceWith(im)};r.readAsDataURL(f)};
/* ánh sáng: đèn dầu chập chờn, ánh trăng loé lên rồi dịu xuống */
const glow=$("#glow"),moon=$("#moon");
setInterval(()=>{glow.style.opacity=document.body.classList.contains("off")?.05:(.74+Math.random()*.26).toFixed(2)},110);
(function tw(){moon.style.opacity=(.06+Math.random()*.2).toFixed(2);setTimeout(tw,300+Math.random()*900)})();
th(0);cvBack(true);paint();
</script></body></html>
